resources:
- ../../config
# grafana.yaml is config/stateful/grafana.yaml, which apply copies into the -local overlay
- grafana.yaml
# apply renders config/grafana/alerting.yaml (its PLACEHOLDER_* thresholds come
# from .config/) to alerting.yaml here, replacing the copy config/ generates
configMapGenerator:
- name: grafana-alerting
  behavior: replace
  files:
  - alerting.yaml
# Contact points and notification policy apply writes from .config/alert-*
secretGenerator:
- name: grafana-notifications
  files:
  - notifications.yaml=grafana-notifications.yaml
patches:
- path: cert-provider.yaml
- path: shared-config.yaml
- path: ui-service-ingress.yaml
- path: cluster-config.yaml
- path: arcus-config-tunable.yaml
- path: cluster-config-tunable.yaml
