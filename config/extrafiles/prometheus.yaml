# my global config
global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
- job_name: 'example-metric'
  scrape_interval: 5s

  metrics_path: /metrics
  scheme: http


  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - default

  relabel_configs:
  - source_labels: [__meta_kubernetes_service_label_app]
    separator: ;
    regex: (alarm-service|api-bridge|client-bridge|driver-services|hub-bridge|ivr-callback-server|history-service|notification-services|platform-services|rule-service|scheduler-service|subsystem-service|tag-service)
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_endpoint_port_name]
    separator: ;
    regex: metrics
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_namespace]
    separator: ;
    regex: (.*)
    target_label: namespace
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_pod_name]
    separator: ;
    regex: (.*)
    target_label: pod
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_service_name]
    separator: ;
    regex: (.*)
    target_label: service
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_service_name]
    separator: ;
    regex: (.*)
    target_label: job
    replacement: ${1}
    action: replace
  - source_labels: [__meta_kubernetes_endpoint_ready]
    separator: ;
    regex: (.*)
    target_label: svcup
    replacement: $1
    action: replace
  - separator: ;
    regex: (.*)
    target_label: endpoint
    replacement: metrics
    action: replace

  metric_relabel_configs:
  # Bridges export one metric per HTTP handler and status code, e.g.
  # com_iris_bridge_metrics_bridge_metrics_bridge_client_http_request_<handler class>_200.
  # Fold them into bridge_http_requests{bridge,handler,status} so dashboards can group them.
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: bridge
    replacement: $1
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: handler
    replacement: $2
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: status
    replacement: $3
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: __name__
    replacement: bridge_http_requests

- job_name: 'cert-manager'
  scrape_interval: 60s
  static_configs:
  - targets: ['cert-manager.cert-manager.svc.cluster.local:9402']

# Traefik (bundled with k3s) serves Prometheus metrics on its "metrics" port.
- job_name: 'traefik'
  scrape_interval: 15s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
    regex: traefik
    action: keep
  - source_labels: [__meta_kubernetes_pod_container_port_name]
    regex: metrics
    action: keep
  - source_labels: [__meta_kubernetes_pod_name]
    target_label: pod

# Container start times from each node's kubelet (cAdvisor), proxied through the API
# server. Only container_start_time_seconds for the default namespace is kept.
- job_name: 'kubelet-cadvisor'
  scrape_interval: 60s
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels: [__meta_kubernetes_node_name]
    target_label: instance
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    regex: (.+)
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: container_start_time_seconds
    action: keep
  - source_labels: [namespace, container]
    regex: default;.+
    action: keep
