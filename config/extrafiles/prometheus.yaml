# my global config
global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
- job_name: 'example-metric'
  scrape_interval: 5s

  metrics_path: /metrics
  scheme: http


  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - default

  relabel_configs:
  - source_labels: [__meta_kubernetes_service_label_app]
    separator: ;
    regex: (alarm-service|api-bridge|client-bridge|driver-services|hub-bridge|ivr-callback-server|history-service|notification-services|platform-services|rule-service|scheduler-service|subsystem-service|tag-service)
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_endpoint_port_name]
    separator: ;
    regex: metrics
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_namespace]
    separator: ;
    regex: (.*)
    target_label: namespace
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_pod_name]
    separator: ;
    regex: (.*)
    target_label: pod
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_service_name]
    separator: ;
    regex: (.*)
    target_label: service
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_service_name]
    separator: ;
    regex: (.*)
    target_label: job
    replacement: ${1}
    action: replace
  - source_labels: [__meta_kubernetes_endpoint_ready]
    separator: ;
    regex: (.*)
    target_label: svcup
    replacement: $1
    action: replace
  - separator: ;
    regex: (.*)
    target_label: endpoint
    replacement: metrics
    action: replace

  metric_relabel_configs:
  # Bridges export one metric per HTTP handler and status code, e.g.
  # com_iris_bridge_metrics_bridge_metrics_bridge_client_http_request_<handler class>_200.
  # Fold them into bridge_http_requests{bridge,handler,status} so dashboards can group them.
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: bridge
    replacement: $1
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: handler
    replacement: $2
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: status
    replacement: $3
  - source_labels: [__name__]
    regex: com_iris_bridge_metrics_bridge_metrics_bridge_(client|api|hub|ivr_callback)_http_request_(?:.+_)?([a-z0-9]+)_([0-9]{3})
    target_label: __name__
    replacement: bridge_http_requests

- job_name: 'cert-manager'
  scrape_interval: 60s
  static_configs:
  - targets: ['cert-manager.cert-manager.svc.cluster.local:9402']

# Pod and workload state (restart counts, CrashLoopBackOff, replica availability).
# honor_labels keeps the namespace/pod/container labels kube-state-metrics reports.
- job_name: 'kube-state-metrics'
  scrape_interval: 30s
  honor_labels: true
  static_configs:
  - targets: ['kube-state-metrics.default.svc.cluster.local:8080']

# Filesystem space on every node, from the node-exporter DaemonSet (one pod per node,
# discovered individually so a multi-node cluster reports each node).
- job_name: 'node-exporter'
  scrape_interval: 60s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - default
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app]
    regex: node-exporter
    action: keep
  - source_labels: [__meta_kubernetes_pod_container_port_name]
    regex: metrics
    action: keep
  - source_labels: [__meta_kubernetes_pod_node_name]
    target_label: node

# Traefik (bundled with k3s) serves Prometheus metrics on its "metrics" port.
- job_name: 'traefik'
  scrape_interval: 15s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kube-system
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
    regex: traefik
    action: keep
  - source_labels: [__meta_kubernetes_pod_container_port_name]
    regex: metrics
    action: keep
  - source_labels: [__meta_kubernetes_pod_name]
    target_label: pod

# Container start times from each node's kubelet (cAdvisor), proxied through the API
# server. Only container_start_time_seconds for the default namespace is kept.
- job_name: 'kubelet-cadvisor'
  scrape_interval: 60s
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels: [__meta_kubernetes_node_name]
    target_label: instance
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels: [__meta_kubernetes_node_name]
    regex: (.+)
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  metric_relabel_configs:
  - source_labels: [__name__]
    regex: container_start_time_seconds
    action: keep
  - source_labels: [namespace, container]
    regex: default;.+
    action: keep

# TCP checks of the external Cassandra, Kafka and ZooKeeper hosts, made by the
# blackbox exporter. apply writes the hosts from .config/ into the
# prometheus-targets ConfigMap, labeled with which datastore each one is.
- job_name: 'blackbox-datastores'
  scrape_interval: 30s
  metrics_path: /probe
  params:
    module: [tcp_connect]
  file_sd_configs:
  - files: ['/etc/prometheus-targets/datastores.json']
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.default.svc.cluster.local:9115

# The certificate hub-bridge serves to hubs on 8082. It comes from the hub-keystore
# secret, which the hub-keystore-renewal CronJob copies from cert-manager's
# certificate, so cert-manager's own metrics don't cover it.
- job_name: 'blackbox-hub-tls'
  scrape_interval: 60s
  metrics_path: /probe
  params:
    module: [tls_connect]
  static_configs:
  - targets: ['hub-bridge-service.default.svc.cluster.local:8082']
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.default.svc.cluster.local:9115

# The other datacenters' internet-facing Grafana health endpoints, so each one
# notices when another (or its monitoring, which can't alert on its own outage)
# goes down. apply writes them from .config/peer-admin-domains into the
# prometheus-targets ConfigMap, labeled with the peer's admin domain.
- job_name: 'blackbox-peers'
  scrape_interval: 60s
  metrics_path: /probe
  params:
    module: [grafana_health]
  file_sd_configs:
  - files: ['/etc/prometheus-targets/peers.json']
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.default.svc.cluster.local:9115
