auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
  - from: "2024-01-01"
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: index_
      period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  # Grafana's alert state history ({from="state-history"}) is small and worth
  # keeping longer than the logs: a month of a rule's transitions
  retention_stream:
  - selector: '{from="state-history"}'
    priority: 1
    period: 720h
  ingestion_burst_size_mb: 16
  ingestion_rate_mb: 8
  # Loki refuses a whole push when one entry is over max_line_size, and Alloy
  # then drops every line in that batch, from every service. Cut the long
  # entry instead (a joined stack trace or a dumped payload) and keep the rest.
  max_line_size: 256KB
  max_line_size_truncate: true
