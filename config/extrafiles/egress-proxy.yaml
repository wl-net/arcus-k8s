# Envoy configuration for the egress proxy (config/egress/egress-proxy.yaml):
# the way out of the cluster for the Arcus services that call third-party
# APIs. It takes HTTPS CONNECT only; plain HTTP is refused.
#
# The hosts in the "listed" virtual host are the destinations we expect.
# Anything else lands in "unlisted", which is still forwarded for now, and
# logged, so the Egress To Unlisted Host alert names what would be refused
# before the proxy starts refusing it.
#
# Every connection is logged in logfmt when it closes, e.g.
#   {app="egress-proxy"} | logfmt | route="unlisted"
admin:
  # Loopback only: the admin interface can stop the proxy. The stats listener
  # below serves the two paths Prometheus and the kubelet need.
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

overload_manager:
  resource_monitors:
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 1000

static_resources:
  listeners:
  - name: egress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3128
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          upgrade_configs:
          - upgrade_type: CONNECT
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "level=info msg=connect destination=%REQ(:AUTHORITY)% route=%ROUTE_NAME% code=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% client=%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% upstream=%UPSTREAM_HOST% sent=%BYTES_SENT% received=%BYTES_RECEIVED% duration_ms=%DURATION%\n"
          route_config:
            name: egress
            virtual_hosts:
            - name: listed
              domains:
              # Twilio: SMS and voice calls (notification-services)
              - api.twilio.com:443
              # Mailgun: email (notification-services)
              - api.mailgun.net:443
              routes:
              - name: listed
                stat_prefix: listed
                match:
                  connect_matcher: {}
                route:
                  cluster: dynamic_forward_proxy
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
            - name: unlisted
              domains: ["*"]
              routes:
              # To refuse unlisted hosts, replace this route's "route" with
              # direct_response: {status: 403}
              - name: unlisted
                stat_prefix: unlisted
                match:
                  connect_matcher: {}
                route:
                  cluster: dynamic_forward_proxy
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
              - name: plain-http
                match:
                  prefix: "/"
                direct_response:
                  status: 403
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: egress
                dns_lookup_family: V4_ONLY
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # /metrics for Prometheus and /ready for the kubelet, from the admin interface
  - name: stats
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9100
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: stats
          route_config:
            name: stats
            virtual_hosts:
            - name: stats
              domains: ["*"]
              routes:
              - match:
                  path: /metrics
                route:
                  cluster: admin
                  prefix_rewrite: /stats/prometheus
              - match:
                  path: /ready
                route:
                  cluster: admin
              - match:
                  prefix: "/"
                direct_response:
                  status: 404
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # The upstream of a CONNECT is the host it names, resolved when it is asked for
  - name: dynamic_forward_proxy
    connect_timeout: 10s
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: egress
          dns_lookup_family: V4_ONLY
  - name: admin
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: admin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
