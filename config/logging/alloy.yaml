apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: default
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    // Give every stream a level label, so error rates are a stream selector
    // ({app="x", level="error"}) and Grafana colours the lines.
    loki.process "pods" {
      forward_to = [loki.write.default.receiver]

      // Arcus services (config/extrafiles/logback.xml) log one event per line as
      // "<level letter><MMdd> <HH:mm:ss.SSS> ...", followed by the stack trace
      // when there is one. Older logback.xml copies wrap the start in colour
      // codes, which are stripped so the first character is the level.
      stage.match {
        selector = "{app=~\"api-bridge|client-bridge|driver-services|history-service|hub-bridge|ivr-callback-server|notification-services|platform-services|rule-service|scheduler-service|subsystem-service|modelmanager\"}"

        stage.replace {
          expression = "(\\x1b\\[[0-9;]*m)"
          replace    = ""
        }
        stage.multiline {
          firstline     = "^[TDIWE]\\d{4} \\d{2}:\\d{2}:\\d{2}\\.\\d{3} "
          max_wait_time = "3s"
        }
        stage.regex {
          expression = "^(?P<level>[TDIWE])\\d{4} "
        }
        stage.template {
          source   = "level"
          template = "{{ if eq .Value \"E\" }}error{{ else if eq .Value \"W\" }}warn{{ else if eq .Value \"I\" }}info{{ else if eq .Value \"D\" }}debug{{ else }}trace{{ end }}"
        }
        stage.labels {
          values = { level = "" }
        }
      }

      // Everything else (Grafana, Loki, Alloy, Traefik, MetalLB) logs logfmt with
      // a level field; lines that aren't logfmt just get no level label.
      stage.match {
        selector = "{app!~\"api-bridge|client-bridge|driver-services|history-service|hub-bridge|ivr-callback-server|notification-services|platform-services|rule-service|scheduler-service|subsystem-service|modelmanager\"}"

        stage.logfmt {
          mapping = { level = "" }
        }
        stage.template {
          source   = "level"
          template = "{{ $l := ToLower .Value }}{{ if or (eq $l \"eror\") (eq $l \"err\") (eq $l \"fatal\") (eq $l \"crit\") }}error{{ else if or (eq $l \"warning\") (eq $l \"wrn\") }}warn{{ else if eq $l \"dbug\" }}debug{{ else }}{{ $l }}{{ end }}"
        }
        stage.labels {
          values = { level = "" }
        }
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki-service.default.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: alloy
  name: alloy
  namespace: default
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      # 473 is the image's own alloy user. Alloy reads pod logs through the API;
      # its only access to the host is the directory that keeps its positions.
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      # The kubelet creates a missing hostPath directory owned by root, and
      # fsGroup doesn't apply to hostPath, so hand it to 473 before Alloy starts.
      initContainers:
      - name: data-owner
        image: grafana/alloy:v1.21.1
        imagePullPolicy: IfNotPresent
        command: ["chown", "473:473", "/var/lib/alloy/data"]
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        volumeMounts:
        - mountPath: /var/lib/alloy/data
          name: data
      containers:
      - image: grafana/alloy:v1.21.1
        imagePullPolicy: IfNotPresent
        name: alloy
        args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        ports:
        - containerPort: 12345
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: "0.05"
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
        - mountPath: /var/lib/alloy/data
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - name: config
        configMap:
          name: alloy-config
      # Log positions, kept on the node so a replaced pod carries on where the
      # last one stopped. Without them it re-sends every pod's whole log, and
      # Loki refuses the lines it already has as too_far_behind.
      - name: data
        hostPath:
          path: /var/lib/arcus/alloy
          type: DirectoryOrCreate
