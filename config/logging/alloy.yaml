apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: alloy
  name: alloy
  namespace: default
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      # 473 is the image's own alloy user. Alloy reads pod logs through the API;
      # its only access to the host is the directory that keeps its positions.
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      # The kubelet creates a missing hostPath directory owned by root, and
      # fsGroup doesn't apply to hostPath, so hand it to 473 before Alloy starts.
      initContainers:
      - name: data-owner
        image: grafana/alloy:v1.21.3
        imagePullPolicy: IfNotPresent
        command: ["chown", "473:473", "/var/lib/alloy/data"]
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        volumeMounts:
        - mountPath: /var/lib/alloy/data
          name: data
      containers:
      - image: grafana/alloy:v1.21.3
        imagePullPolicy: IfNotPresent
        name: alloy
        args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        ports:
        - containerPort: 12345
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: "0.05"
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
        - mountPath: /var/lib/alloy/data
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      # config.alloy, generated by config/kustomization.yaml. Alloy doesn't
      # reload it when it changes, so the generated name's hash suffix is what
      # rolls the pod onto a new pipeline.
      - name: config
        configMap:
          name: alloy-config
      # Log positions, kept on the node so a replaced pod carries on where the
      # last one stopped. Without them it re-sends every pod's whole log, and
      # Loki refuses the lines it already has as too_far_behind.
      - name: data
        hostPath:
          path: /var/lib/arcus/alloy
          type: DirectoryOrCreate
