apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: prometheus
  name: prometheus
  namespace: default
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - image: prom/prometheus:v3.15.1
        imagePullPolicy: IfNotPresent
        name: prometheus
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "1"
          requests:
            cpu: "0.05"
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          # /-/healthy answers during WAL replay; /-/ready does not
          httpGet:
            path: /-/healthy
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/prometheus-data"
          name: prometheus-storage
        - mountPath: /etc/prometheus
          name: config
        - mountPath: /etc/prometheus-targets
          name: targets
        # Keep 30 days, but never more than 4GB (the volume is 5Gi), whichever
        # comes first, so a burst of new series can't fill the disk.
        args: ['--web.listen-address=0.0.0.0:9080', '--config.file=/etc/prometheus/prometheus.yaml',
               '--storage.tsdb.path=/prometheus-data/data', '--storage.tsdb.retention.time=30d',
               '--storage.tsdb.retention.size=4GB']
      # The service account token stays mounted: kubernetes_sd_configs in
      # prometheus.yaml discovers scrape targets through the API (clusterrole.yaml).
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      # 65534 is the image's own nobody user, which already owns the data on
      # existing volumes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: prometheus-config
          items:
          - key: prometheus.yaml
            path: prometheus.yaml
      # Probe targets written by apply from .config/; optional so Prometheus
      # still starts before the first apply creates it
      - name: targets
        configMap:
          name: prometheus-targets
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: prometheus-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi

