apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: prometheus
  name: prometheus
  namespace: default
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - image: prom/prometheus:v3.15.0
        imagePullPolicy: IfNotPresent
        name: prometheus
        resources:
          limits:
            cpu: "1"
          requests:
            cpu: "0.05"
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          # /-/healthy answers during WAL replay; /-/ready does not
          httpGet:
            path: /-/healthy
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/prometheus-data"
          name: prometheus-storage
        - mountPath: /etc/prometheus
          name: config
        - mountPath: /etc/prometheus-targets
          name: targets
        args: ['--web.listen-address=0.0.0.0:9080', '--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.path=/prometheus-data/data']
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: prometheus-config
          items:
          - key: prometheus.yaml
            path: prometheus.yaml
      # Probe targets written by apply from .config/; optional so Prometheus
      # still starts before the first apply creates it
      - name: targets
        configMap:
          name: prometheus-targets
          optional: true
  volumeClaimTemplates:
  - metadata:
      name: prometheus-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi

