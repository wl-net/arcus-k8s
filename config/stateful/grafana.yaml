apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: default
spec:
  serviceName: grafana
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - env:
        - name: CASSANDRA_HOST
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_CONTACTPOINTS
              name: cluster-config
        - name: CASSANDRA_KEYSPACE
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_KEYSPACE
              name: arcus-config
        - name: GF_SERVER_ROOT_URL
          value: https://PLACEHOLDER_ADMIN_DOMAIN
        # Grafana only reads this when it creates the admin user on first start,
        # so a new datacenter never comes up as admin/admin and an existing one
        # keeps the password set in its database. Generated by configure/apply
        # into secret/grafana.admin.password.
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: grafana.admin.password
              name: shared
        - name: GF_RENDERING_SERVER_URL
          value: http://grafana-renderer.default.svc.cluster.local:8081/render
        - name: GF_RENDERING_CALLBACK_URL
          value: http://grafana-service.default.svc.cluster.local:3000
        - name: GF_RENDERING_RENDERER_TOKEN
          valueFrom:
            secretKeyRef:
              key: grafana.renderer.token
              name: shared
        - name: GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE
          value: "true"
        # Alert state changes are written to Loki (stream {from="state-history"})
        # instead of Grafana's database, so a rule's History tab and Alerting >
        # History show every transition and they can be queried next to the logs
        - name: GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND
          value: loki
        - name: GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL
          value: http://loki-service.default.svc.cluster.local:3100
          #ports:
          #- containerPort: 3000
          #name: tcp-3000
        image: grafana/grafana:13.3.0
        imagePullPolicy: IfNotPresent
        name: grafana
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: "0.05"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          # Generous threshold so database migrations on upgrade can finish
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/var/lib/grafana"
          name: grafana-storage
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasources
        - mountPath: /etc/grafana/provisioning/alerting
          name: alerting
        - mountPath: /etc/grafana/provisioning/dashboards
          name: dashboards-provider
        - mountPath: /etc/grafana/provisioning/dashboards/json
          name: dashboards
        - mountPath: /tmp
          name: tmp
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      # 472 is the image's own grafana user, which already owns the data on
      # existing volumes, so this changes nothing on disk.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: datasources
        configMap:
          name: grafana-datasources
      # Alert rules from config/grafana/alerting.yaml (rendered by apply) and the
      # contact points and notification policy apply writes to the
      # grafana-notifications Secret from .config/alert-*. The Secret is optional
      # so that a -local overlay generated before the secretGenerator existed
      # still starts Grafana.
      - name: alerting
        projected:
          sources:
          - configMap:
              name: grafana-alerting
          - secret:
              name: grafana-notifications
              optional: true
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
  volumeClaimTemplates:
  - metadata:
      name: grafana-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana-renderer
  name: grafana-renderer
  namespace: default
spec:
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      containers:
      - image: grafana/grafana-image-renderer:v5.12.10
        imagePullPolicy: IfNotPresent
        name: grafana-renderer
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Grafana takes up to 5 alert screenshots at once
        # (max_concurrent_screenshots), each a Chromium page
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: "10m"
            memory: 128Mi
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: grafana.renderer.token
              name: shared
        ports:
        - containerPort: 8081
          name: tcp-8081
        # Chromium keeps its profile and temp files under /tmp
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      # 65532 is the image's nonroot user
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: grafana-renderer
  name: grafana-renderer
spec:
  ports:
  - port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: grafana-renderer
  sessionAffinity: None
  type: ClusterIP

