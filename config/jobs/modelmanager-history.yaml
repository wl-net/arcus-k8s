apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: modelmanager-history
    app.kubernetes.io/version: 2026.3.0
  name: modelmanager-history
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: modelmanager-history
    spec:
      containers:
      - env:
        - name: MODELMANAGER_HOME
          value: /modelmanager-2026.3.0/history-resources/
        - name: MODELMANAGER_SCHEMA
          value: history
        - name: MODELMANAGER_AUTO
          value: "true"
        - name: cassandra_history_contactPoints
          valueFrom:
            configMapKeyRef:
              key: cassandra_history_contactPoints
              name: cluster-config
        - name: CASSANDRA_HISTORY_LOCAL_DATACENTER
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_HISTORY_LOCAL_DATACENTER
              name: cluster-config
              optional: true
        - name: BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              key: BOOTSTRAP_SERVERS
              name: cluster-config
        - name: OPS_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              key: BOOTSTRAP_SERVERS
              name: cluster-config
        image: ghcr.io/wl-net/arcusplatform/arcus-modelmanager:2026.3.0
        imagePullPolicy: IfNotPresent
        command: ["/modelmanager-2026.3.0/bin/modelmanager"]
        args: ["-c", "/modelmanager-2026.3.0/conf/arcus-modelmanager.properties"]
        name: modelmanager-history
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
