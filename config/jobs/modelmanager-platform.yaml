apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: modelmanager-platform
    # apply and deploy run the schema-migration Jobs themselves, before any
    # service changes, and leave them out of kubectl apply -k
    arcus.io/role: schema-migration
  name: modelmanager-platform
  namespace: default
spec:
  # One retry for a passing Cassandra error; the deadline ends a run that hangs
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: modelmanager-platform
    spec:
      containers:
      - env:
        - name: MODELMANAGER_SCHEMA
          value: platform
        - name: MODELMANAGER_AUTO
          value: "true"
        - name: cassandra_contactPoints
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_CONTACTPOINTS
              name: cluster-config
        # The Cassandra driver only uses nodes in its local datacenter, which is
        # datacenter1 unless set. Optional: older -local tunables lack the key.
        - name: cassandra_local_datacenter
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_LOCAL_DATACENTER
              name: cluster-config
              optional: true
        # The keyspace the services use
        - name: cassandra_keyspace
          valueFrom:
            configMapKeyRef:
              key: CASSANDRA_KEYSPACE
              name: cluster-config
        - name: BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              key: BOOTSTRAP_SERVERS
              name: cluster-config
        - name: OPS_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              key: BOOTSTRAP_SERVERS
              name: cluster-config
        - name: PARTITION_COUNT
          valueFrom:
            configMapKeyRef:
              key: PARTITION_COUNT
              name: arcus-config
        - name: IRIS_AES_SECRET
          valueFrom:
            secretKeyRef:
              key: iris.aes.secret
              name: shared
        - name: IRIS_AES_IV
          valueFrom:
            secretKeyRef:
              key: iris.aes.iv
              name: shared
        - name: QUESTIONS_AES_SECRET
          valueFrom:
            secretKeyRef:
              key: questions.aes.secret
              name: shared
        # The tag comes from config/kustomization.yaml, the same release as the services
        image: ghcr.io/wl-net/arcusplatform/arcus-modelmanager
        imagePullPolicy: IfNotPresent
        # The image installs to /modelmanager-<version>/ (-SNAPSHOT for a private
        # build), so the path is looked up rather than written here
        command:
        - /bin/sh
        - -c
        - |
          set -- /modelmanager-*/
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected one /modelmanager-*/ directory in the image, found: $*" >&2
            exit 1
          fi
          home=$1
          export MODELMANAGER_HOME="$home"
          exec "${home}bin/modelmanager" -c "${home}conf/arcus-modelmanager.properties" -P production
        name: modelmanager-platform
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      # A failed attempt leaves its pod, and its log, for the retry to sit next to
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
