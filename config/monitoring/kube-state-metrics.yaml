# kube-state-metrics exposes pod and workload state from the Kubernetes API (restart counts,
# waiting reasons such as CrashLoopBackOff, pods stuck Pending, replica availability, stuck
# Deployment rollouts, failed Jobs, CronJob successes, node conditions) for Prometheus and
# alerting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kube-state-metrics
  name: kube-state-metrics
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        imagePullPolicy: IfNotPresent
        name: kube-state-metrics
        args:
        - --port=8080
        - --telemetry-port=8081
        - --resources=pods,deployments,statefulsets,daemonsets,cronjobs,jobs,nodes
        - --metric-allowlist=kube_pod_container_info,kube_pod_container_status_restarts_total,kube_pod_container_status_waiting_reason,kube_pod_container_status_last_terminated_reason,kube_pod_container_status_ready,kube_pod_status_phase,kube_deployment_spec_replicas,kube_deployment_status_replicas_available,kube_deployment_status_condition,kube_statefulset_replicas,kube_statefulset_status_replicas_ready,kube_daemonset_status_number_unavailable,kube_cronjob_status_last_successful_time,kube_job_failed,kube_job_status_start_time,kube_node_status_condition
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8081
          name: telemetry
        livenessProbe:
          httpGet:
            path: /livez
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: "0.01"
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kube-state-metrics
  name: kube-state-metrics
  namespace: default
spec:
  ports:
  - name: http-metrics
    port: 8080
    protocol: TCP
    targetPort: http-metrics
  selector:
    app: kube-state-metrics
  type: ClusterIP
