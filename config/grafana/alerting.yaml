    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          sum(increase({__name__=~"com_iris_bridge_metrics_bridge_metrics_bridge_(client|api)_pin_verify_mismatched"}[15m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "219"
      summary: 'PIN verification failures'
      description: '{{ printf "%.0f" $values.B.Value }} place PIN checks mismatched in 15 minutes. A PIN is four digits and a mismatch surfaces to the app as a generic error, so this counter is the only visible sign of PIN guessing. First steps: ./arcuscmd.sh logs client-bridge | grep -i pin for the person and source address; one person failing a few times forgot their PIN, steady volume or many places is an attack.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/pin-verify-failures.md
  - uid: hub-authz-violations
    title: Hub Authorization Violations
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          sum by (reason) (increase(label_replace({__name__=~"bridge_hub_authz_.+"},
          "reason", "$1", "__name__", "bridge_hub_authz_(.+)")[5m:15s]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "17"
      summary: 'Hub authorization violation detected'
      description: 'hub-bridge refused hub messages ({{ $labels.reason }}) in the last 5 minutes. source.mismatch is a hub claiming another hub''s address (spoofing, or a cloned or restored hub); place.mismatch is a hub sending for a place it does not belong to; unauthorized is traffic from a session that never authorized. First steps: ./arcuscmd.sh logs hub-bridge and find the hub ID and source address on the warn lines, then compare with the hubs registered to that place.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/hub-authz-violations.md
  - uid: hub-cert-rejections
    title: Hub Certificate Rejected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          sum by (reason) (increase(label_replace({__name__=~"bridge_hub_ssl_cert_.+"},
          "reason", "$1", "__name__", "bridge_hub_ssl_cert_(.+)")[5m:15s]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
