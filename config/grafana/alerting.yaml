    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (integration) (increase(grafana_alerting_notifications_failed_total[15m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "31"
      summary: 'Grafana could not deliver {{ $labels.integration }} notifications'
      description: 'Grafanas {{ $labels.integration }} contact point failed to send in the last 15 minutes, so alerts are firing without reaching anyone (this one included, unless another integration works). First steps: Alerting > Contact points > Test in Grafana and ./arcuscmd.sh logs grafana for the HTTP error. A rotated Discord webhook or Pushover token goes in .config/alert-discord-webhook or .config/alert-pushover-*, then ./arcuscmd.sh apply.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/grafana-notifications-failing.md
  - uid: prometheus-storage-errors
    title: Prometheus Storage Errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: increase(prometheus_tsdb_compactions_failed_total[2h]) + increase(prometheus_tsdb_wal_corruptions_total[2h])
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "32"
      summary: 'Prometheus storage errors'
      description: 'Prometheus failed a compaction or found a corrupt WAL segment in the last 2 hours; metrics may be missing and the next restart may be slow or fail. The volume being full is the usual cause. First steps: kubectl exec prometheus-0 -- df -h /prometheus-data and ./arcuscmd.sh logs prometheus. Retention is capped at 4GB and 30 days in config/stateful/prometheus.yaml.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/prometheus-storage-errors.md
  - uid: alloy-dropping-logs
    title: Log Shipping Dropping Entries
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (node, reason) (increase(loki_write_dropped_entries_total{job="alloy"}[10m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "33"
      summary: 'Alloy on {{ $labels.node }} dropped {{ printf "%.0f" $values.B.Value }} log entries ({{ $labels.reason }})'
      description: 'Alloy gave up sending log entries to Loki in the last 10 minutes ({{ $labels.reason }}); those lines are lost. ingester_error covers Loki answering with an error or not at all for the whole retry window (about 8 minutes; Monitoring Service Down) and Loki rejecting a push outright, which drops every line in that batch (Loki Discarding Logs says why). First steps: kubectl logs -l app=alloy --all-pods --prefix --since=15m | grep "final error" for the status and Loki''s message (the pod on {{ $labels.node }}), then ./arcuscmd.sh logs loki.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/alloy-dropping-logs.md
  - uid: loki-discarding-logs
    title: Loki Discarding Logs
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (reason) (increase(loki_discarded_samples_total[10m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "33"
      summary: 'Loki discarded {{ printf "%.0f" $values.B.Value }} log lines in 10 minutes ({{ $labels.reason }})'
      description: 'Loki refused log lines in the last 10 minutes with reason {{ $labels.reason }}: rate_limited means a pod is logging faster than the ingestion limits in config/extrafiles/loki.yaml allow (the Log Volume panel shows which), line_too_long a line over the limit, and the others a label or timestamp problem from the Alloy pipeline in config/logging/alloy.yaml. Those lines are lost. First steps: ./arcuscmd.sh logs loki and the Log Volume by Service panel.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/loki-discarding-logs.md
  - uid: log-flood
    title: Log Flood
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (app) (rate({app=~".+"}[5m])) * 60
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 60000
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "60"
      summary: '{{ $labels.app }} is writing {{ printf "%.0f" $values.B.Value }} log lines a minute'
      description: '{{ $labels.app }} has averaged more than 60000 log lines a minute (1000 a second) over the last 5 minutes, hundreds of times its normal rate. That is a tight loop logging each pass, such as a Kafka consumer polling with no partitions assigned, not load. It fills Loki and the node disk and buries every other log. First steps: ./arcuscmd.sh logs {{ $labels.app }} | tail -n 40 to see the repeated line; a service stuck retrying since a restart or a ZooKeeper Session Expired is cleared by ./arcuscmd.sh deletepod {{ $labels.app }}; a line that is merely chatty is quietened in config/extrafiles/logback.xml.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/log-flood.md

# How alert notifications read. Grafana's default message lists the raw query
# values (A=1, B=1, C=0) and every label, with the summary and description
# buried at the end. The contact points and notification policy are provisioned
# by apply from .config/alert-* (see script/deploy.sh) with these templates; a
# contact point set up by hand in Grafana needs them in its fields:
#   Discord:  Title {{ template "arcus.title" . }}  Message {{ template "arcus.message" . }}
#   Pushover: Title {{ template "arcus.title" . }}  Message {{ template "arcus.text" . }}
# Discord cuts messages at 2000 characters and Pushover at 1024, so only the
# first firing alert's description is included, and at most 5 firing and 5
# resolved alerts are listed.
templates:
- orgId: 1
  name: arcus
  template: |-
    {{ define "arcus.title" -}}
    {{ if not .Alerts.Firing }}Resolved: {{ end }}{{ or .CommonLabels.alertname "Grafana alerts" }} · {{ reReplaceAll `^https?://(admin\.)?([^/:]+).*$` "$2" .ExternalURL }}
    {{- end }}

    {{ define "arcus.body" -}}
    {{ range $i, $a := .Alerts.Firing }}{{ if lt $i 5 -}}
    🔴 {{ or $a.Annotations.summary $a.Labels.alertname }}
    {{ end }}{{ end -}}
    {{ if gt (len .Alerts.Firing) 5 -}}
    …{{ len .Alerts.Firing }} firing in total
    {{ end -}}
    {{ with .Alerts.Firing }}{{ with (index . 0).Annotations.description -}}
    {{ . }}
    {{ end }}{{ end -}}
    {{ range $i, $a := .Alerts.Resolved }}{{ if lt $i 5 -}}
    ✅ Resolved after {{ ($a.EndsAt.Sub $a.StartsAt).Round 1000000000 }}: {{ or $a.Annotations.summary $a.Labels.alertname }}
    {{ end }}{{ end -}}
    {{ if gt (len .Alerts.Resolved) 5 -}}
    …{{ len .Alerts.Resolved }} resolved in total
    {{ end -}}
    {{ end }}

    {{ define "arcus.text" -}}
    {{ template "arcus.body" . -}}
    {{ with .Alerts.Firing }}{{ with (index . 0).Annotations.runbook_url -}}
    Runbook: {{ . }}
    {{ end }}{{ end -}}
    {{ end }}

    {{ define "arcus.message" -}}
    {{ template "arcus.body" . -}}
    -# {{ or .CommonLabels.severity "alert" }}
    {{- with index .Alerts 0 }}{{ with .GeneratorURL }} · [Rule](<{{ . }}>){{ end }}
    {{- if .PanelURL }} · [Panel](<{{ .PanelURL }}>){{ else if .DashboardURL }} · [Dashboard](<{{ .DashboardURL }}>){{ end }}
    {{- with .Annotations.runbook_url }} · [Runbook](<{{ . }}>){{ end }}{{ end }}
    {{- if eq (len .Alerts.Firing) 1 }} · [Silence](<{{ (index .Alerts.Firing 0).SilenceURL }}>){{ end }}
    {{- end }}
