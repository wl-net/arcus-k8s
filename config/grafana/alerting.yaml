        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        # > 0 skips a Certificate that has never been issued (cert-manager reports 0 for it).
        expr: ((certmanager_certificate_expiration_timestamp_seconds > 0) - time()) / 86400
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
          operator:
            type: and
          reducer:
            type: last
        refId: C
