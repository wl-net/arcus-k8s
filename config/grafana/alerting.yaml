  - uid: unauthorized-access
    title: Unauthorized Access Attempt
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        # One sum over every bridge_authz_unauthorized_* counter: adding them with
        # '+' would drop a job that has not registered all of them yet. The
        # label_replace keeps a reason label so increase() (which strips the
        # metric name) does not see duplicate series; that needs the subquery.
        expr: >-
          sum by (job) (increase(label_replace({__name__=~"bridge_authz_unauthorized_.+"},
          "reason", "$1", "__name__", "bridge_authz_unauthorized_(.+)")[5m:15s]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "6"
      summary: 'Unauthorized access attempt detected'
      description: '{{ $labels.job }} received unauthorized access attempts in the last 5 minutes. First steps: ./arcuscmd.sh logs client-bridge (or the bridge behind {{ $labels.job }}) and look at the authorization failures: which person, which place and which source address. Many places tried from one source points to probing; one person hitting the wrong place is more often a stale app session.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/unauthorized-access.md
