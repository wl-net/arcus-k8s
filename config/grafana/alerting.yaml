        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "9"
      summary: 'Hub TLS certificate rejected'
      description: 'hub-bridge rejected hub TLS handshakes ({{ $labels.reason }}) in the last 5 minutes. blacklisted is a certificate on the revocation blacklist — possibly a stolen or factory-reset hub trying to connect; rejected is an untrusted certificate; missing is a hub that presented none where mutual auth is required. First steps: ./arcuscmd.sh logs hub-bridge | grep -i cert for the certificate subject and source address.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/hub-cert-rejections.md
  - uid: session-churn-high
