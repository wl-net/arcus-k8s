    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          max by (namespace, job_name) (kube_job_failed{condition="true"} == 1
          and on (namespace, job_name) (time() - kube_job_status_start_time) < 21600)
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Job {{ $labels.job_name }} failed'
      description: '{{ $labels.job_name }} in namespace {{ $labels.namespace }} failed in the last 6 hours (its retries are used up). For a modelmanager-* job the schema migration did not run; for a hub-keystore-renewal-* job the hub certificate was not refreshed (Hub Certificate Expiring fires if that goes on). First steps: kubectl logs job/{{ $labels.job_name }} -n {{ $labels.namespace }} and kubectl describe job/{{ $labels.job_name }} -n {{ $labels.namespace }}. ./arcuscmd.sh modelmanager re-runs the modelmanager jobs. The alert clears 6 hours after the failure, or when the job is deleted.'
  - uid: public-endpoint-unreachable
    title: Public Endpoint Unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: probe_success{job="blackbox-public"}
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.instance }} is not answering from the internet side'
      description: 'The probe resolves the public name and connects like a user or hub would, and has failed for 5 minutes (unreachable, not a 2xx/3xx answer, or an invalid certificate). DNS, the Route 53 record, port forwarding, Traefik or the certificate can be at fault; the in-cluster services may well be fine. A drained cluster still passes, because the name then points at the other datacenter. First steps: ./arcuscmd.sh check and ./arcuscmd.sh info, then curl -v {{ $labels.instance }} from outside the LAN; for hub.<domain>:8082, openssl s_client -connect against it.'
- orgId: 1
  name: Monitoring Health
  folder: Provisioned
  interval: 1m
  rules:
  - uid: grafana-notifications-failing
    title: Alert Notifications Failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (integration) (increase(grafana_alerting_notifications_failed_total[15m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Grafana could not deliver {{ $labels.integration }} notifications'
      description: 'Grafanas {{ $labels.integration }} contact point failed to send in the last 15 minutes, so alerts are firing without reaching anyone (this one included, unless another integration works). First steps: Alerting > Contact points > Test in Grafana and ./arcuscmd.sh logs grafana for the HTTP error. A rotated Discord webhook or Pushover token goes in .config/alert-discord-webhook or .config/alert-pushover-*, then ./arcuscmd.sh apply.'
  - uid: prometheus-storage-errors
    title: Prometheus Storage Errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: increase(prometheus_tsdb_compactions_failed_total[2h]) + increase(prometheus_tsdb_wal_corruptions_total[2h])
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Prometheus storage errors'
      description: 'Prometheus failed a compaction or found a corrupt WAL segment in the last 2 hours; metrics may be missing and the next restart may be slow or fail. The volume being full is the usual cause. First steps: kubectl exec prometheus-0 -- df -h /prometheus-data and ./arcuscmd.sh logs prometheus. Retention is capped at 4GB and 30 days in config/stateful/prometheus.yaml.'
  - uid: alloy-dropping-logs
    title: Log Shipping Dropping Entries
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (pod, reason) (increase(loki_write_dropped_entries_total{job="alloy"}[10m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Alloy on {{ $labels.pod }} dropped {{ printf "%.0f" $values.B.Value }} log entries ({{ $labels.reason }})'
      description: 'Alloy gave up sending log entries to Loki in the last 10 minutes ({{ $labels.reason }}); those lines are lost. Loki refusing them (Loki Discarding Logs says why) or being down (Monitoring Service Down) are the usual causes. First steps: kubectl logs {{ $labels.pod }} and ./arcuscmd.sh logs loki.'
  - uid: loki-discarding-logs
    title: Loki Discarding Logs
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum by (reason) (increase(loki_discarded_samples_total[10m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Loki discarded {{ printf "%.0f" $values.B.Value }} log lines in 10 minutes ({{ $labels.reason }})'
      description: 'Loki refused log lines in the last 10 minutes with reason {{ $labels.reason }}: rate_limited means a pod is logging faster than the ingestion limits in config/extrafiles/loki.yaml allow (the Log Volume panel shows which), line_too_long a line over the limit, and the others a label or timestamp problem from the Alloy pipeline in config/logging/alloy.yaml. Those lines are lost. First steps: ./arcuscmd.sh logs loki and the Log Volume by Service panel.'

# How alert notifications read. Grafana's default message lists the raw query
# values (A=1, B=1, C=0) and every label, with the summary and description
# buried at the end. The contact points and notification policy are provisioned
# by apply from .config/alert-* (see script/deploy.sh) with these templates; a
# contact point set up by hand in Grafana needs them in its fields:
#   Discord:  Title {{ template "arcus.title" . }}  Message {{ template "arcus.message" . }}
#   Pushover: Title {{ template "arcus.title" . }}  Message {{ template "arcus.text" . }}
# Discord cuts messages at 2000 characters and Pushover at 1024, so only the
# first firing alert's description is included, and at most 5 firing and 5
# resolved alerts are listed.
templates:
- orgId: 1
  name: arcus
  template: |-
    {{ define "arcus.title" -}}
    {{ if not .Alerts.Firing }}Resolved: {{ end }}{{ or .CommonLabels.alertname "Grafana alerts" }} · {{ reReplaceAll `^https?://(admin\.)?([^/:]+).*$` "$2" .ExternalURL }}
    {{- end }}

    {{ define "arcus.text" -}}
    {{ range $i, $a := .Alerts.Firing }}{{ if lt $i 5 -}}
    🔴 {{ or $a.Annotations.summary $a.Labels.alertname }}
    {{ end }}{{ end -}}
    {{ if gt (len .Alerts.Firing) 5 -}}
    …{{ len .Alerts.Firing }} firing in total
    {{ end -}}
    {{ with .Alerts.Firing }}{{ with (index . 0).Annotations.description -}}
    {{ . }}
    {{ end }}{{ end -}}
    {{ range $i, $a := .Alerts.Resolved }}{{ if lt $i 5 -}}
    ✅ Resolved after {{ ($a.EndsAt.Sub $a.StartsAt).Round 1000000000 }}: {{ or $a.Annotations.summary $a.Labels.alertname }}
    {{ end }}{{ end -}}
    {{ if gt (len .Alerts.Resolved) 5 -}}
    …{{ len .Alerts.Resolved }} resolved in total
    {{ end -}}
    {{ end }}

    {{ define "arcus.message" -}}
    {{ template "arcus.text" . -}}
    -# {{ or .CommonLabels.severity "alert" }}
    {{- with index .Alerts 0 }}{{ with .GeneratorURL }} · [Rule](<{{ . }}>){{ end }}
    {{- if .PanelURL }} · [Panel](<{{ .PanelURL }}>){{ else if .DashboardURL }} · [Dashboard](<{{ .DashboardURL }}>){{ end }}{{ end }}
    {{- if eq (len .Alerts.Firing) 1 }} · [Silence](<{{ (index .Alerts.Firing 0).SilenceURL }}>){{ end }}
    {{- end }}
