            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "63"
      summary: '{{ $labels.app }} lost its ZooKeeper session and restarted'
      description: '{{ $labels.app }} logged "Zookeeper session expired" in the last 10 minutes. A service that loses its session drops its cluster membership and exits, Kubernetes restarts it, and everything it owned waits until it re-registers; usually every service goes at once. A session only expires when the client cannot reach any member in its connect string for longer than the session timeout, so with a single member in .config/zookeeper-host that member being away is enough. First steps: kubectl get pods for the restarts, ./arcuscmd.sh logs <app> | grep -i zookeeper, then the ZooKeeper servers'' logs for the minute before (a follower losing the leader, or a restart).'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/zookeeper-session-expired.md
  - uid: keystore-renewal-stale
