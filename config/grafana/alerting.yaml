      __panelId__: "22"
      summary: '{{ $labels.instance }} is not answering from the internet side'
      description: 'The probe resolves the public name and connects like a user or hub would, and has failed for 5 minutes (unreachable, not a 2xx/3xx answer, or an invalid certificate). DNS, the Route 53 record, port forwarding, Traefik or the certificate can be at fault; the in-cluster services may well be fine. A drained cluster still passes, because the name then points at the other datacenter. First steps: ./arcuscmd.sh check and ./arcuscmd.sh info, then curl -v {{ $labels.instance }} from outside the LAN; for hub.<domain>:8082, openssl s_client -connect against it.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/public-endpoint-unreachable.md
  # The realm counts login failures by cause; the label_replace keeps the cause
  # as a label so increase() (which strips the metric name) does not see
  # duplicate series, which needs the subquery. no_username and error are left
  # out: they are malformed requests and server errors, not guessing.
  - uid: login-failures-elevated
    title: Login Failures Elevated
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          sum by (cause) (increase(label_replace({__name__=~"security_login_failed_(unknown_account|bad_credentials)"},
          "cause", "$1", "__name__", "security_login_failed_(.+)")[15m:15s]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "218"
      summary: 'Login failures elevated'
      description: '{{ printf "%.0f" $values.B.Value }} password logins failed with {{ $labels.cause }} in 15 minutes. Many unknown_account failures are account enumeration or credential stuffing; bad_credentials concentrated on one account is targeted guessing. First steps: ./arcuscmd.sh logs client-bridge and look at the usernames and source addresses on the failures; many accounts from one address is an attack, one account failing repeatedly is a person or a stale app retrying.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/login-failures-elevated.md
  - uid: pin-verify-failures
    title: PIN Verification Failures
    condition: C
