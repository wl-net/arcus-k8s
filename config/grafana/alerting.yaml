    annotations:
      summary: '{{ $labels.job }} is down'
      description: 'Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes. Users are not affected, but the alerts that read from it are blind: with Loki or Alloy down the log alerts stop, with Grafana down nothing alerts at all (the other datacenters notice through Peer Datacenter Unreachable). First steps: kubectl get pods -l app={{ $labels.job }}, kubectl describe pod and kubectl logs for it; for kubelet-cadvisor, kubectl get --raw /api/v1/nodes/{{ $labels.instance }}/proxy/metrics/cadvisor.'
  - uid: pod-pending
    title: Pod Stuck Pending
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          max by (namespace, pod) (kube_pod_status_phase{phase="Pending"} == 1
          unless on (namespace, pod) kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"} == 1)
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.pod }} has been Pending for 10 minutes'
      description: '{{ $labels.pod }} in namespace {{ $labels.namespace }} has not started. Either it cannot be scheduled (the node has less free CPU or memory than its requests, see Allocated resources in kubectl describe node) or a volume, Secret or ConfigMap it mounts is missing. During a rollout the old pod keeps serving, so the service runs the previous version until this is fixed. First steps: kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }} and read the Events at the end.'
  - uid: rollout-stuck
    title: Deployment Rollout Stuck
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: max by (namespace, deployment) (kube_deployment_status_condition{condition="Progressing", status="false"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Rollout of {{ $labels.deployment }} is stuck'
      description: 'The new pods of {{ $labels.deployment }} did not become ready within the 10 minute progress deadline, so the Deployment has given up. The old pod keeps serving (maxUnavailable is 0), so the service runs the previous version. Workload Unavailable does not fire in this case. First steps: kubectl rollout status deployment/{{ $labels.deployment }}, kubectl get pods -l app={{ $labels.deployment }} and ./arcuscmd.sh logs {{ $labels.deployment }} on the new pod; kubectl rollout undo deployment/{{ $labels.deployment }} goes back to the previous version.'
  - uid: job-failed
    title: Job Failed
    condition: C
