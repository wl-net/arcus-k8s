    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "22"
      summary: 'Datacenter {{ $labels.peer }}: {{ $labels.instance }} is unreachable from here'
      description: '{{ $labels.instance }} at datacenter {{ $labels.peer }} has failed for 5 minutes: unreachable, an unexpected status, an invalid certificate, or (for /api/health) Grafana''s database not ok. The public hostnames are checked at that datacenter''s own address, so this is independent of where the weighted public record points. If only /api/health fails, that datacenter''s monitoring is down and it may not be able to alert on its own. First steps: open https://{{ $labels.peer }}/, run ./arcuscmd.sh status and ./arcuscmd.sh check on that cluster, and check its Route 53 health check.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/peer-datacenter-unreachable.md
  - uid: monitoring-service-down
    title: Monitoring Service Down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: up{job=~"prometheus|grafana|loki|alloy|kube-state-metrics|node-exporter|kubelet-cadvisor|cert-manager"}
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: Alerting
    # the one rule left on Error: Prometheus itself down for 5 minutes raises DatasourceError here
    execErrState: Error
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "30"
      summary: '{{ $labels.job }} is down'
      description: 'Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes. Users are not affected, but the alerts that read from it are blind: with Loki or Alloy down the log alerts stop, with Grafana down nothing alerts at all (the other datacenters notice through Peer Datacenter Unreachable). First steps: kubectl get pods -l app={{ $labels.job }}, kubectl describe pod and kubectl logs for it; for kubelet-cadvisor, kubectl get --raw /api/v1/nodes/{{ $labels.instance }}/proxy/metrics/cadvisor.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/monitoring-service-down.md
  - uid: pod-pending
