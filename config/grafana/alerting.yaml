# Grafana alert rules, provisioned from this file (apply renders the PLACEHOLDER_*
# thresholds from .config/ first). Severity decides who is told, through the
# notification policy apply provisions:
#   critical  users or hubs are affected now, or will be without action today
#             (goes to Pushover as well as Discord)
#   warning   needs attention in working hours; nothing is down for users
#   info      for the record
apiVersion: 1
groups:
- orgId: 1
  name: Node Health
  folder: Provisioned
  interval: 1m
  rules:
  - uid: node-disk-filling
    title: Node Disk Filling
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter"} / node_filesystem_size_bytes{job="node-exporter"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 80
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 30m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "1"
      summary: 'Disk {{ $labels.mountpoint }} on {{ $labels.node }} is {{ printf "%.0f" $values.B.Value }}% full'
      description: 'The kubelet deletes unused images once the disk passes 75%, so on a node with /etc/rancher/k3s/config.yaml.d/arcus-image-gc.yaml something else is growing; without that file (./arcuscmd.sh k3s writes it) the kubelet waits until 85% and old release images are the usual cause (sudo k3s crictl rmi --prune). At 95% it evicts pods. First steps: on {{ $labels.node }}, sudo du -xh --max-depth=2 {{ $labels.mountpoint }} | sort -h | tail to see what grew. The usual causes are container logs under /var/log/pods and the Loki, Prometheus and Grafana volumes under /var/lib/rancher/k3s/storage (kubectl get pvc).'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-disk-filling.md
  - uid: node-disk-critical
    title: Node Disk Critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter"} / node_filesystem_size_bytes{job="node-exporter"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "1"
      summary: 'Disk {{ $labels.mountpoint }} on {{ $labels.node }} is {{ printf "%.0f" $values.B.Value }}% full'
      description: 'The kubelet deletes unused images above 75% (85% on a node without /etc/rancher/k3s/config.yaml.d/arcus-image-gc.yaml, which ./arcuscmd.sh k3s writes), so the disk is filling faster than it can clean up, and at 95% it evicts pods. First steps: free space now on {{ $labels.node }} with sudo k3s crictl rmi --prune and sudo journalctl --vacuum-size=200M, then find what grew with sudo du -xh --max-depth=2 {{ $labels.mountpoint }} | sort -h | tail (old backups, tarballs, container logs, the volumes under /var/lib/rancher/k3s/storage).'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-disk-critical.md
  - uid: node-memory-low
    title: Node Memory Low
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * min by (node) (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 10
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "2"
      summary: 'Only {{ printf "%.0f" $values.B.Value }}% of the memory on {{ $labels.node }} is available'
      description: 'Less than 10% of the memory on {{ $labels.node }} has been available for 10 minutes, so the kernel is swapping or dropping cache, and once less than 100Mi is left the kubelet evicts pods. First steps: kubectl top pods -A --sort-by=memory to see what grew, and free -m on {{ $labels.node }} for anything outside Kubernetes (Cassandra, Kafka or ZooKeeper if they run on this host). The Arcus JVMs use about 3 times their -Xmx, so a raised heap or memory limit in config/deployments/ is a common cause.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-memory-low.md
  # Pressure stall information: the share of time at least one runnable process was waiting
  # for a CPU. Unlike utilization it stays near 0 while the CPUs keep up, however busy they are.
  - uid: node-cpu-saturated
    title: Node CPU Saturated
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * max by (node) (rate(node_pressure_cpu_waiting_seconds_total{job="node-exporter"}[5m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 25
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 15m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "3"
      summary: 'Processes on {{ $labels.node }} are waiting for a CPU {{ printf "%.0f" $values.B.Value }}% of the time'
      description: 'For 15 minutes, something runnable on {{ $labels.node }} has been kept waiting for a CPU more than 25% of the time (/proc/pressure/cpu), so services there are slowed by a shortage of CPU. A healthy node stays near 0%. First steps: kubectl top pods -A --sort-by=cpu, and top on {{ $labels.node }} for anything outside Kubernetes (Cassandra, Kafka or ZooKeeper if they run on this host).'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-cpu-saturated.md
  - uid: node-swapping
    title: Node Swapping
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: max by (node) (rate(node_vmstat_pswpin{job="node-exporter"}[5m]) + rate(node_vmstat_pswpout{job="node-exporter"}[5m])) * 4096 / 1048576
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 15m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "4"
      summary: '{{ $labels.node }} has been swapping {{ printf "%.1f" $values.B.Value }} MiB/s for 15 minutes'
      description: 'Pages are moving to and from swap continuously, so the node is short of memory and everything on it is slower; the JVMs are the usual cause. First steps: kubectl top pods --sort-by=memory against each services limit in config/deployments/, free -m and ps -eo rss,comm --sort=-rss | head on {{ $labels.node }} for what is using it outside the pods (k3s itself is several hundred MB). Lower a services -Xmx and limit, or add memory.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-swapping.md
  - uid: node-not-ready
    title: Node Not Ready
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: kube_node_status_condition{condition="Ready", status="true"}
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "5"
      summary: '{{ $labels.node }} is not Ready'
      description: 'The kubelet on {{ $labels.node }} has not reported Ready for 5 minutes; its pods are not being scheduled and, after a few more minutes, are evicted. First steps: kubectl describe node {{ $labels.node }} (Conditions), then on the node: systemctl status k3s, journalctl -u k3s -n 200, df -h and free -m.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-not-ready.md
  - uid: node-pressure
    title: Node Under Pressure
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "5"
      summary: '{{ $labels.node }} reports {{ $labels.condition }}'
      description: 'The kubelet on {{ $labels.node }} has had {{ $labels.condition }} for 5 minutes, so it is evicting pods and refusing new ones. First steps: kubectl describe node {{ $labels.node }} (Conditions and Events) and kubectl get pods -A --field-selector=status.phase=Failed for what was evicted; then free -m, df -h or ps -e | wc -l on the node depending on the condition.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/node-pressure.md
- orgId: 1
  name: Service Health
  folder: Provisioned
  interval: 1m
  rules:
  - uid: service-down
    title: Service Down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        # Ready endpoints only (svcup comes from the endpoint's ready flag), so a
        # pod that is still rolling out next to a serving one does not count; a
        # job with no ready endpoint falls back to whatever endpoints it has.
        expr: >-
          min by (job) (up{job!~"prometheus|grafana|loki|alloy|kube-state-metrics|node-exporter|kubelet-cadvisor|cert-manager", svcup!="false"})
          or min by (job) (up{job!~"prometheus|grafana|loki|alloy|kube-state-metrics|node-exporter|kubelet-cadvisor|cert-manager"})
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 5m
    noDataState: Alerting
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-overview
      __panelId__: "1"
      summary: '{{ $labels.job }} is down'
      description: '{{ $labels.job }} has had no ready pod answering on its metrics port for more than 5 minutes. First steps: ./arcuscmd.sh status to see which pods are not ready, then kubectl describe pod and ./arcuscmd.sh logs <app> for the service behind {{ $labels.job }}; for a blackbox-* job, check the blackbox-exporter pod first.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/service-down.md
  - uid: pod-crash-looping
    title: Pod Crash Looping
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        # Containers flip between Running and waiting while backing off, so look across 5m.
        # Keep this window shorter than `for` so a single crash (one short backoff) never fires.
        expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "11"
      summary: '{{ $labels.container }} in {{ $labels.pod }} is crash looping'
      description: '{{ $labels.container }} ({{ $labels.namespace }}/{{ $labels.pod }}) keeps crashing and Kubernetes is backing off its restarts. First steps: kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous for the crash, and kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }} for Last State; OOMKilled means the memory limit in config/deployments/ is too low.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/pod-crash-looping.md
  # One kill is enough: Kubernetes restarts the container at once, so Pod Crash Looping only
  # fires if it keeps happening. Fires for 10 minutes after each kill.
  - uid: container-oom-killed
    title: Container OOM Killed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          max by (namespace, pod, container) (
          increase(kube_pod_container_status_restarts_total[10m]) > 0
          and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "10"
      summary: '{{ $labels.container }} in {{ $labels.pod }} was killed for running out of memory'
      description: '{{ $labels.container }} ({{ $labels.namespace }}/{{ $labels.pod }}) went over its memory limit and the kernel killed it (OOMKilled). Kubernetes restarted it, but whatever it was doing was lost. First steps: kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }} for Last State and the limit. For an Arcus service, compare the memory limit in config/deployments/ with its -Xmx (the services use about 3 times their heap), and check Old Gen After GC on the overview dashboard for a leak.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/container-oom-killed.md
  - uid: image-pull-failing
    title: Image Pull Failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"}[5m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "11"
      summary: '{{ $labels.container }} in {{ $labels.pod }} cannot pull its image'
      description: '{{ $labels.container }} ({{ $labels.namespace }}/{{ $labels.pod }}) has been unable to pull its image for 10 minutes. First steps: kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }} and read the Events for the exact pull error, then check the tag (newTag in config/kustomization.yaml) exists in the registry.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/image-pull-failing.md
  # Service Down only sees pods Prometheus can scrape: a Pending pod has no target, and
  # one failing its readiness probe still answers scrapes. Rollouts don't trip this,
  # since the deployments surge a new pod before taking the old one away.
  # The workload's name is in whichever of deployment/statefulset/daemonset it has.
  - uid: workload-unavailable
    title: Workload Unavailable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: >-
          max by (namespace, deployment, statefulset, daemonset) (
          (kube_deployment_spec_replicas - kube_deployment_status_replicas_available)
          or (kube_statefulset_replicas - kube_statefulset_status_replicas_ready)
          or kube_daemonset_status_number_unavailable)
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "12"
      summary: '{{ or $labels.deployment $labels.statefulset $labels.daemonset }} has {{ $values.B.Value }} unavailable pod(s)'
      description: '{{ or $labels.deployment $labels.statefulset $labels.daemonset }} ({{ $labels.namespace }}) has had fewer ready pods than it should for 10 minutes. First steps: kubectl get pods -n {{ $labels.namespace }} -o wide | grep {{ or $labels.deployment $labels.statefulset $labels.daemonset }}, then kubectl describe pod on the one that is not Ready. Pending with FailedScheduling means the node has no room for its resource requests; Running but not Ready means its readiness probe is failing, so read its logs. If Pod Crash Looping or Image Pull Failing is firing for it too, start there.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/workload-unavailable.md
  # cert-manager renews at 2/3 of a certificate's lifetime, so an overdue renewal is the
  # earliest sign that issuance is failing, whatever the certificate lifetime is.
  - uid: cert-renewal-overdue
    title: Certificate Renewal Overdue
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        # > 0 skips a Certificate that has never been issued (cert-manager reports 0 for it).
        expr: (time() - (certmanager_certificate_renewal_timestamp_seconds > 0)) / 3600
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 24
          operator:
            type: and
          reducer:
            type: last
        refId: C
    for: 15m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
    annotations:
      __dashboardUid__: arcus-cluster
      __panelId__: "21"
      summary: 'Certificate {{ $labels.name }} renewal is overdue'
      description: '{{ $labels.name }} in namespace {{ $labels.namespace }} should have renewed {{ printf "%.0f" $values.B.Value }} hours ago. First steps: kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}, then kubectl get certificaterequest,order,challenge -n {{ $labels.namespace }} and ./arcuscmd.sh certlogs for why issuance is stuck; once fixed, ./arcuscmd.sh renewcert {{ $labels.name }} forces a re-issue.'
      runbook_url: https://github.com/wl-net/arcus-k8s/blob/PLACEHOLDER_RUNBOOK_REF/docs/runbooks/cert-renewal-overdue.md
  - uid: cert-expiring-soon
