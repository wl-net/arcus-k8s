  - uid: zookeeper-session-expired
    title: ZooKeeper Session Expired
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        # Grafana and Loki log this query's text every evaluation, so leave them out
        expr: sum by (app) (count_over_time({app=~".+", app!~"grafana|loki"} |= "Zookeeper session expired" [10m]))
        instant: true
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: "-100"
      model:
        type: reduce
