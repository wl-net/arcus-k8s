---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-keystore-renewal
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-keystore-renewal
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["nginx-production-tls", "hub-keystore", "truststore"]
  verbs: ["get", "create", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["hub-bridge"]
  verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-keystore-renewal
  namespace: default
subjects:
- kind: ServiceAccount
  name: hub-keystore-renewal
  namespace: default
roleRef:
  kind: Role
  name: hub-keystore-renewal
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-keystore-renewal
  namespace: default
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # A run takes seconds, or about 2 minutes when it restarts hub-bridge. Stop one that
      # hangs, since Forbid would hold back every later run behind it.
      activeDeadlineSeconds: 600
      # failedJobsHistoryLimit only drops a failed run once newer runs fail, so remove
      # finished runs after a week instead of keeping their pods indefinitely.
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: hub-keystore-renewal
          restartPolicy: Never
          # nobody in both images; fsGroup lets it read the mounted secret and
          # share the work volume between the two containers
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          # alpine/k8s has no openssl, so the key is converted to PKCS#8 here,
          # from the secret as it was when the pod started
          initContainers:
          - name: convert-key
            image: alpine/openssl:3.5.9
            command:
            - /bin/sh
            - -euc
            - |
              if [ ! -f /tls/tls.key ]; then
                echo "nginx-production-tls not found (staging cert?). Nothing to convert."
                exit 0
              fi

              # Verify the certificate has not expired
              if ! openssl x509 -in /tls/tls.crt -checkend 0 -noout; then
                echo "ERROR: certificate has expired. Skipping update."
                exit 1
              fi

              # Convert to PKCS#8
              openssl pkcs8 -in /tls/tls.key -topk8 -nocrypt -out /work/tls.key
              cp /tls/tls.crt /work/tls.crt
            resources:
              limits:
                cpu: 200m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - mountPath: /tls
              name: tls
              readOnly: true
            - mountPath: /work
              name: work
          containers:
          - name: hub-keystore-renewal
            image: alpine/k8s:1.37.1
            env:
            # kubectl keeps its discovery cache under $HOME
            - name: HOME
              value: /tmp
            command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              # Get the resourceVersion of the source TLS secret, and its
              # certificate in the same read so the two agree
              SOURCE=$(kubectl get secret nginx-production-tls \
                -o jsonpath='{.metadata.resourceVersion} {.data.tls\.crt}' 2>/dev/null) || true

              if [[ -z "$SOURCE" ]]; then
                echo "nginx-production-tls not found (staging cert?). Skipping."
                exit 0
              fi

              SOURCE_RV=${SOURCE%% *}
              SOURCE_CRT=${SOURCE#* }

              # Check if hub-keystore already matches this version
              CURRENT_RV=$(kubectl get secret hub-keystore \
                -o jsonpath='{.metadata.annotations.arcus\.io/source-resource-version}' 2>/dev/null) || true

              if [[ "$SOURCE_RV" == "$CURRENT_RV" ]]; then
                echo "hub-keystore is up to date (resourceVersion=${SOURCE_RV}). No action needed."
                exit 0
              fi

              echo "Source resourceVersion=${SOURCE_RV}, current=${CURRENT_RV:-<none>}. Updating hub-keystore..."

              # The init container converted the secret as it was when the pod
              # started; make sure that is still the version being recorded
              if [[ ! -s /work/tls.key ]] || ! base64 -d <<<"$SOURCE_CRT" | cmp -s - /work/tls.crt; then
                echo "ERROR: nginx-production-tls changed after this pod started. The next attempt picks it up."
                exit 1
              fi

              # Apply over hub-keystore rather than delete and recreate, so it
              # never goes missing while hub-bridge might mount it
              kubectl create secret tls hub-keystore --cert /work/tls.crt --key /work/tls.key \
                --dry-run=client -o yaml | kubectl apply -f -

              # Annotate with source resourceVersion for idempotency
              kubectl annotate secret hub-keystore \
                "arcus.io/source-resource-version=${SOURCE_RV}" --overwrite

              # Restart hub-bridge to pick up new keystore
              kubectl rollout restart deployment/hub-bridge
              kubectl rollout status deployment/hub-bridge --timeout=120s

              echo "hub-keystore updated and hub-bridge restarted."
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - mountPath: /work
              name: work
              readOnly: true
            - mountPath: /tmp
              name: tmp
          volumes:
          # Absent on a staging datacenter, which leaves the init container nothing to do
          - name: tls
            secret:
              secretName: nginx-production-tls
              optional: true
              defaultMode: 0440
          # Memory-backed, so the private key never reaches the node's disk
          - name: work
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
