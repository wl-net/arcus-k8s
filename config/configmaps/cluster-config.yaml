apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
  labels:
    app: arcus
  name: cluster-config
  namespace: default
data:
  # apply fills in the PLACEHOLDER_* hosts from .config/
  # (the ZooKeeper one is a connect string: list every ensemble member, or a
  # single member's downtime expires every service's session)
  BOOTSTRAP_SERVERS: PLACEHOLDER_KAFKA_HOST
  CLUSTER_SERVICE_DAO: zookeeper
  CLUSTER_ZK_HOST: PLACEHOLDER_ZOOKEEPER_HOST
  # Session timeout must ride out brief WAN stalls between sites: the ZK
  # leader is across the public internet, and with the 4s default a ~5s blip
  # expired every service's session at once and restarted the whole platform
  # (2026-10-24 01:36 UTC). Must stay under ZK's maxSessionTimeout (40s).
  CLUSTER_ZK_TIMEOUT: "15000"
  cassandra_history_contactPoints: PLACEHOLDER_CASSANDRA_HOST
  cassandra_contactPoints: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_CONTACTPOINTS: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_HOST: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_KEYSPACE: production
  CASSANDRA_LOADBALANCINGPOLICY: roundrobin
  ZOOKEEPER: PLACEHOLDER_ZOOKEEPER_HOST
  ZOOKEEPEROPS: PLACEHOLDER_ZOOKEEPER_HOST
  SCHEDULER_SANITY_CHECK: "true"
