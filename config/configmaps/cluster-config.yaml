apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
  labels:
    app: arcus
  name: cluster-config
  namespace: default
data:
  # apply fills in the PLACEHOLDER_* hosts from .config/
  BOOTSTRAP_SERVERS: PLACEHOLDER_KAFKA_HOST
  CLUSTER_SERVICE_DAO: zookeeper
  CLUSTER_ZK_HOST: PLACEHOLDER_ZOOKEEPER_HOST
  cassandra_history_contactPoints: PLACEHOLDER_CASSANDRA_HOST
  cassandra_contactPoints: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_CONTACTPOINTS: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_HOST: PLACEHOLDER_CASSANDRA_HOST
  CASSANDRA_KEYSPACE: production
  CASSANDRA_LOADBALANCINGPOLICY: roundrobin
  ZOOKEEPER: PLACEHOLDER_ZOOKEEPER_HOST
  ZOOKEEPEROPS: PLACEHOLDER_ZOOKEEPER_HOST
  SCHEDULER_SANITY_CHECK: "true"
