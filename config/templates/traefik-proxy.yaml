apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        exposedPort: 80
        proxyProtocol:
          trustedIPs:
            - "PLACEHOLDER_PROXY_IP"
      websecure:
        exposedPort: 443
        proxyProtocol:
          trustedIPs:
            - "PLACEHOLDER_PROXY_IP"
